name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: tests (Home Assistant ${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.14"
            homeassistant: "2026.9.2"
            xmltodict: "1.0.4"
            zusatz: ""
          - python: "3.13"
            homeassistant: "2025.8.0"
            xmltodict: "0.13.0"
            zusatz: "pycares<5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: |
          grep -v -e '^homeassistant==' -e '^xmltodict==' requirements_test.txt > anforderungen.txt
          echo "homeassistant==${{ matrix.homeassistant }}" >> anforderungen.txt
          echo "xmltodict==${{ matrix.xmltodict }}" >> anforderungen.txt
          echo "${{ matrix.zusatz }}" >> anforderungen.txt
          pip install -r anforderungen.txt
      - run: pytest
