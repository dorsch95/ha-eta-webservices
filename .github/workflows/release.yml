name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag, der geprüft und gepackt werden soll
        required: true

permissions:
  contents: read

jobs:
  version:
    name: Tag passt zur Version im Manifest
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Version im Manifest mit dem Tag vergleichen
        run: |
          python3 - <<'PRUEFUNG'
          import json
          import os
          import sys

          tag = os.environ["TAG"]
          version = json.load(open("custom_components/eta_heating_ws/manifest.json"))["version"]
          if tag != version:
              print(
                  f"::error::Der Tag {tag} passt nicht zur Version {version} im Manifest. "
                  "HACS zeigt den Tag an, Home Assistant die Version aus dem Manifest. "
                  "Erst die Version setzen lassen, dann das Release neu anlegen."
              )
              sys.exit(1)
          print(f"Tag und Version stimmen überein: {version}")
          PRUEFUNG

  paket:
    name: Zip-Datei für HACS an das Release hängen
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Integration packen, manifest.json muss oben in der Zip-Datei liegen
        run: |
          cd custom_components/eta_heating_ws
          zip -r -q "$RUNNER_TEMP/eta_heating_ws.zip" . -x '*__pycache__*'
          unzip -l "$RUNNER_TEMP/eta_heating_ws.zip" manifest.json
      - name: Zip-Datei hochladen, HACS laedt sie und GitHub zaehlt die Downloads
        run: gh release upload "$TAG" "$RUNNER_TEMP/eta_heating_ws.zip" --clobber
