            left: 6%
            color: '#9aa5b1'
            font-size: 90%
            transform: translate(0, -50%)
          prefix: 'Außen: '
        - type: state-label
          entity: sensor.eta_heizung_kesseltemperatur
          style:
            top: 12%
            left: 6%
            color: '#e8615f'
            font-size: 90%
            transform: translate(0, -50%)
          prefix: 'Kessel: '
