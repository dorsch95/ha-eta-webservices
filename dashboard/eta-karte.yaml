type: vertical-stack
cards:
- type: conditional
  conditions:
  - condition: screen
    media_query: '(max-width: 767px)'
  card:
    type: grid
    columns: 2
    square: false
    cards:
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.eta_heizung_komponente_kessel
        state: kessel
      card:
        type: picture-elements
        image: /local/community/ha-eta-webservices/kessel.png
        elements:
        - type: state-label
          entity: sensor.eta_heizung_aussentemperatur
          style:
            top: 4%
            left: 6%
            color: '#9aa5b1'
            font-size: 90%
            transform: translate(0, -50%)
          prefix: 'Außen: '
        - type: state-label
          entity: sensor.eta_heizung_kesseltemperatur
          style:
            top: 12%
            left: 6%
            color: '#e8615f'
            font-size: 90%
            transform: translate(0, -50%)
          prefix: 'Kessel: '
        - type: state-label
          entity: sensor.eta_heizung_kessel_solltemperatur
          style:
            top: 19%
            left: 6%
            color: '#e2867f'
            font-size: 90%
            transform: translate(0, -50%)
          prefix: 'Soll: '
        - type: state-label
          entity: sensor.eta_heizung_rucklauftemperatur
          style:
            top: 26%
            left: 6%
            color: '#7b88e0'
            font-size: 90%
            transform: translate(0, -50%)
          prefix: 'RL: '
        - type: state-label
          entity: sensor.eta_heizung_kesseldruck
          style:
            top: 33%
            left: 6%
            color: '#d3a15a'
            font-size: 90%
            transform: translate(0, -50%)
          prefix: 'Anlagendruck: '
        - type: state-label
          entity: sensor.eta_heizung_pellet_inhalt_tagesbehalter
          style:
            top: 40%
            left: 6%
            color: '#5fbfa8'
            font-size: 90%
            transform: translate(0, -50%)
          prefix: 'Tagesbehälter: '
        - type: state-label
          entity: sensor.eta_heizung_aschebox_status
          style:
            top: 47%
            left: 6%
            color: '#a98fd0'
            font-size: 90%
            transform: translate(0, -50%)
          prefix: 'Asche: '
        - type: state-label
          entity: sensor.eta_heizung_restsauerstoff
          style:
            top: 54%
            left: 6%
            color: '#d89a6a'
            font-size: 90%
            transform: translate(0, -50%)
          prefix: 'O₂: '
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.eta_heizung_komponente_pufferspeicher
        state: puffer
      card:
        type: picture-elements
        image: /local/community/ha-eta-webservices/puffer.png
