karte_erzeugen:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: eta_heating_ws
lieferung_eintragen:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: eta_heating_ws
    datum:
      selector:
        date:
    menge:
      required: true
      selector:
        number:
          min: 1
          max: 100000
          step: 1
          unit_of_measurement: kg
          mode: box
    preis:
      selector:
        number:
          min: 0
          max: 2000
          step: 0.01
          unit_of_measurement: EUR/t
          mode: box
